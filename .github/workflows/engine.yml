name: engine

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Hangyeol product pin is rustc ≥ 1.88. This rhwp SHA pulls aes 0.9.3
          # (rust-version 1.89). 1.93.1 matches rhwp's rust-toolchain.toml.
          toolchain: "1.93.1"
      - name: Product gates must not be ignored
        run: |
          if grep -nE '#\[ignore\]' engine/tests/gates.rs engine/tests/render_spike.rs; then
            echo "engine/tests/gates.rs and render_spike.rs must not use #[ignore] — replace/insert/delete/table/image keep-on-save + linesegarray=0 + §8 SVG spike always run"
            exit 1
          fi
      - name: Test hangyeol_engine
        run: |
          # Always run lib + integration gates. --include-ignored so a stray
          # #[ignore] cannot skip replace/insert/delete/table/image
          # keep-on-save/linesegarray=0.
          cargo test --manifest-path engine/Cargo.toml -- --include-ignored
